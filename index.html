<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="description" content="四章手繪動作 Roguelike。跟住最後一盞潮燈闖入地城、救回村民，揭開以壽命換糧的契約。">
<title>貓貓啟示錄｜最後一盞潮燈</title>
<link rel="stylesheet" href="./game.css?v=caravan">
<script src="./phaser.min.js" defer></script>
<script src="./sound.js?v=black-moon" defer></script>
<script src="./campaign.js?v=black-moon" defer></script>
<script src="./merchant.js?v=caravan" defer></script>
<script src="./rules.js?v=caravan" defer></script>
<script src="./cinema.js?v=caravan" defer></script>
<script src="./weapon-art.js?v=caravan" defer></script>
<script src="./merchant-ui.js?v=caravan" defer></script>
<script src="./game.js?v=caravan" defer></script>
</head>
<body>
<main id="game">
  <div id="stage" aria-label="遊戲場景"></div>
  <div id="screen-flash" aria-hidden="true"></div>
  <section id="title">
    <div class="cover" aria-hidden="true"></div>
    <div class="title-copy">
      <p class="edition">NINE TIDES</p>
      <h1>貓貓啟示錄</h1>
      <p class="subtitle">最後一盞潮燈</p>
      <p class="premise">霧吞沒了村落。帶上糧店的舊印，跟住商隊追查失蹤的貓。</p>
      <button type="button" id="start" class="primary" disabled>點燃潮燈 <span>›</span></button>
      <p class="start-controls" id="boot-status" role="status">正在載入海霧…</p>
    </div>
  </section>
  <div id="hud" hidden>
    <div class="vitals"><div id="hearts" aria-label="生命"></div><div id="fervor" aria-label="潮力" hidden></div><div id="room-name"></div></div>
    <div class="top-right"><span id="counter" aria-label="潮火"></span><button id="survey" type="button" aria-label="巡景鏡頭" aria-pressed="false" hidden>巡景</button><button id="pause" type="button" aria-label="暫停">Ⅱ</button></div>
  </div>
  <div id="village-stats" aria-label="村落狀態" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="arrival" aria-hidden="true"></div>
  <div id="survey-guide" role="status" hidden>拖動環視潮燈村 <span>·</span> 再點巡景返回</div>
  <div id="stations" hidden></div>
  <div id="stick" aria-hidden="true" hidden><i></i></div>
  <div id="boss-meter" hidden><span id="boss-name"></span><i><b id="boss-fill"></b></i></div>
  <div id="controls" hidden>
    <button data-input="equipment" type="button" aria-label="武器技" hidden><i>✦</i><span>武器技</span><kbd>E</kbd></button>
    <button data-input="flask" type="button" aria-label="藥湯"><i>♜</i><span>藥湯 <b id="flask-count"></b></span><kbd>R</kbd></button>
    <button data-input="cast" type="button" aria-label="潮刃"><i>✧</i><span>潮刃</span><kbd>Q</kbd></button>
    <button data-input="dash" type="button" aria-label="翻滾"><i>↗</i><span>翻滾</span><kbd>空白</kbd></button>
    <button data-input="attack" type="button" aria-label="鐮刀攻擊"><i>☽</i><span>鐮刀</span><kbd>左鍵</kbd></button>
  </div>
  <div id="modal" hidden></div>
</main>
<noscript>請啟用 JavaScript 以遊玩《貓貓啟示錄》。</noscript>
</body>
</html>
