<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓貓啟示錄登入驗證碼</title></head>
<body style="margin:0;background:#121019;color:#efdfc7;font-family:Arial,'Microsoft JhengHei',sans-serif">
  <table role="presentation" style="width:100%;border-collapse:collapse;background:#121019"><tr><td style="padding:36px 16px">
    <table role="presentation" style="width:100%;max-width:500px;margin:auto;border-collapse:collapse;border:1px solid #a98760;background:#201a29"><tr><td style="padding:32px 28px">
      <p style="margin:0 0 12px;color:#b99d78;font-size:12px;letter-spacing:4px">緋月之森 · 守燈者名冊</p>
      <h1 style="margin:0 0 24px;color:#f6dbac;font-size:28px">貓貓啟示錄</h1>
      <p style="font-size:16px;line-height:1.8">輸入以下一次性驗證碼，登入你的守燈者帳號。</p>
      <div style="margin:26px 0;padding:22px 10px;text-align:center;border:1px solid #b89465;background:#15121d;color:#ffe6b7;font-family:monospace;font-size:34px;font-weight:bold;letter-spacing:6px">{{ .Token }}</div>
      <p style="font-size:14px;line-height:1.9;color:#d2c1b0">請返回原本遊玩的瀏覽器輸入驗證碼。登入後，該裝置未綁定的訪客及離線挑戰會合併到帳號。</p>
      <p style="margin-top:24px;font-size:12px;line-height:1.8;color:#ab9da5">如你沒有要求登入，可以忽略此郵件。請勿將驗證碼交給其他人。</p>
      <p style="margin-top:26px"><a href="https://wcy.hk/meow-revelation/" style="color:#e6c38e;font-size:13px">返回貓貓啟示錄</a></p>
    </td></tr></table>
  </td></tr></table>
</body>
</html>
