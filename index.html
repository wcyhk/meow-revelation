<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#151716">
  <meta name="description" content="《貓貓啟示錄：緋月之森》原創黑暗童話動作冒險。">
  <title>貓貓啟示錄 · 緋月之森</title>
  <base href="./eclipse/">
  <link rel="canonical" href="https://wcy.hk/meow-revelation/">
  <link rel="preload" href="./art/moon-gate.webp" as="image">
  <link rel="stylesheet" href="./style.css?v=world-3d-1">
  <link rel="stylesheet" href="./dialogue.css?v=story-portraits-1">
  <link rel="stylesheet" href="./gilded.css?v=gilded-1">
  <link rel="stylesheet" href="./touch.css?v=boss-camera-1">
  <link rel="stylesheet" href="./relic-interface.css?v=armory-art-1">
  <link rel="stylesheet" href="./weapon-viewer.css?v=solo-preview-1">
  <link rel="stylesheet" href="./afterglow.css?v=afterglow-1">
  <link rel="stylesheet" href="./ascendant.css?v=golden-veil-1">
  <link rel="stylesheet" href="./title-menu.css?v=golden-veil-1">
  <link rel="stylesheet" href="./playback.css?v=quiet-music-ui-1">
  <link rel="stylesheet" href="./player-ui.css?v=auth-onboarding-1">
  <link rel="stylesheet" href="./interface-motion.css?v=lantern-ui-1">
  <link rel="stylesheet" href="./quiet-ui.css?v=quiet-ui-1">
  <script type="module" src="./game.mjs?v=forged-relics-1"></script>
  <script type="module" src="./offline.mjs?v=lantern-ui-1" async></script>
</head>
<body>
  <main id="game" aria-label="貓貓啟示錄">
    <canvas id="world" aria-label="戰鬥場景"></canvas>
    <div id="lantern-dark" aria-hidden="true" hidden></div>
    <div id="boss-shroud" aria-hidden="true"></div>
    <div id="elemental-surge" aria-hidden="true"></div>
    <div id="enemy-radar" aria-hidden="true" hidden></div>
    <div id="eye-marks" aria-hidden="true" hidden></div>
    <div id="damage-vignette" aria-hidden="true"></div>
    <section id="cover" aria-label="遊戲主畫面">
      <div class="title-posters" aria-hidden="true">
        <img src="./art/moon-gate.webp" alt="" fetchpriority="high">
        <img class="awakened-poster" src="./art/lantern-ascendant.webp" alt="">
      </div>
      <div class="cover-frame" aria-hidden="true"></div>
      <div class="cover-toolbar">
        <span class="cover-wallet" id="entry-gold">金幣 0</span>
        <button id="player-account" type="button" class="account-chip" aria-label="玩家登入" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg><span class="menu-label">登入</span><i aria-hidden="true"></i></button>
      </div>
      <div class="title-menu">
        <header class="title-group">
          <span class="title-subtitle">緋月之森</span>
          <h1><button id="cover-title" type="button" aria-label="貓貓啟示錄。連續按三下切換無敵測試模式" aria-pressed="false">貓貓啟示錄</button></h1>
          <p>提燈入林，帶小燈回家。</p>
        </header>
        <nav class="title-actions" aria-label="遊戲選單">
          <button class="primary" id="begin" disabled aria-busy="true"><span class="title-icon" aria-hidden="true">✦</span><span>開始冒險</span><span class="title-chevron" aria-hidden="true">→</span></button>
          <div class="menu-group" role="group" aria-label="準備冒險"><span class="menu-group-label" aria-hidden="true">整裝</span><button id="bestiary" type="button" disabled>練習場</button><button id="training" type="button" disabled>訓練所</button></div>
          <div class="menu-group" role="group" aria-label="旅程紀錄"><span class="menu-group-label" aria-hidden="true">旅程</span><button id="records" type="button" disabled>個人紀錄</button><button id="leaderboard" type="button" disabled>排行榜</button></div>
        </nav>
        <p id="player-summary" aria-live="polite" hidden></p>
        <div id="load-note" role="status">正在點亮森林的燭火⋯⋯</div>
      </div>
      <div class="cover-footer">
        <span id="test-mode-status" role="status" class="test-mode-status" hidden></span>
        <div class="offline-pack"><span id="offline-status" aria-live="polite">準備離線資源⋯⋯</span><button id="offline-retry" type="button" hidden>重試下載</button><progress id="offline-progress" max="100" aria-label="離線資源下載進度" hidden></progress></div>
      </div>
      <div id="title-flare" aria-hidden="true"><i></i><b></b></div>
    </section>
    <section id="hud" hidden aria-label="戰鬥資訊">
      <div class="health-hud"><div class="portrait"></div><div class="health-info">
        <div class="hero-name">守燈貓 <span id="hp-number"></span></div>
        <div class="health-track" role="meter" aria-label="生命" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="hp-fill"></div></div>
        <div class="hero-loadout"><span id="equipped"></span><button id="relic-icons" type="button" aria-label="已獲得的祝福" hidden></button></div>
        <span id="field-support" hidden></span>
      </div></div>
      <div class="route-hud"><div id="route-name"></div><div id="route-floor"></div><div id="route-dots"></div><div class="run-counters"><span>擊倒 <b id="run-kills">0</b></span><span>時間 <b id="run-time">0:00</b></span><span>金幣 <b id="run-gold">0</b></span></div></div>
      <div class="utility"><button id="practice-edit" type="button" hidden>換配搭</button><button id="journal" aria-label="探索手記" title="探索手記（L）">▤</button><button id="mute" aria-label="靜音" aria-pressed="false">♫</button><button id="pause" aria-label="暫停">Ⅱ</button></div>
      <section id="practice-damage" aria-label="即時傷害統計" hidden></section>
      <div id="boss-hud" hidden>
        <div id="boss-primary">
          <div><i aria-hidden="true">◆</i> <span id="boss-name"></span> <i aria-hidden="true">◆</i></div>
          <div class="boss-track"><div id="boss-fill"></div></div>
          <div id="boss-arena-hint"></div>
          <div id="boss-weakness" hidden></div>
        </div>
        <div id="boss-echo" hidden>
          <div><i aria-hidden="true">◇</i> <span id="boss-echo-name"></span> <i aria-hidden="true">◇</i></div>
          <div class="boss-track"><div id="boss-echo-fill"></div></div>
        </div>
      </div>
      <div id="mission-status" hidden>
        <strong id="mission-title"></strong>
        <span id="mission-text"></span>
        <div id="mission-track" hidden><div id="mission-fill"></div></div>
      </div>
      <div id="mission-pins" aria-hidden="true"></div>
      <div id="school-toast" role="status" hidden></div>
      <div id="objective"></div>
      <button id="inspect" hidden><i aria-hidden="true">◇</i><span></span><kbd>E</kbd></button>
      <div id="announce" aria-live="polite"><small id="announce-kicker"></small><strong id="announce-title"></strong><p id="announce-line"></p></div>
      <div class="inputs">
        <div id="stick" aria-hidden="true" hidden><i></i></div>
        <div id="touch-cast" aria-hidden="true" hidden><i></i><b></b></div>
        <div class="touch-guide">
          <span>拖動移動 · 點按普攻 · 快撥翻滾</span>
          <span>點紋章自動瞄準 · 拖紋章放手施技</span>
        </div>
        <div class="keys"><kbd>W A S D</kbd> 移動 <kbd>Esc</kbd> 暫停</div>
        <button id="spell" type="button" class="action" aria-label="月輪" aria-disabled="true" hidden>
          <span aria-hidden="true">☾</span>
          <b id="spell-cooldown" aria-hidden="true" hidden></b>
          <small class="spell-caption" aria-hidden="true"><em>月輪</em><kbd>Q</kbd></small>
          <i id="skill-link" aria-hidden="true" hidden></i>
        </button>
        <div class="actions">
          <button id="dodge" class="action" aria-label="翻滾"><span>»</span><em>翻滾</em><kbd>Space</kbd></button>
          <button id="strike" class="action attack" aria-label="斬擊"><span>✦</span><em>斬擊</em><i class="combo-pips" aria-hidden="true"><b></b><b></b><b></b></i><kbd>J</kbd></button>
        </div>
      </div>
    </section>
    <div id="time-fracture" aria-hidden="true" hidden><div class="fracture-clock"><b></b><b></b><b></b><b></b></div></div>
    <section id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="panel">
        <span id="modal-mark" aria-hidden="true">✧</span>
        <div id="modal-kicker"></div>
        <h2 id="modal-title"></h2>
        <p id="modal-copy"></p>
        <div id="modal-content"></div>
        <div id="modal-actions"></div>
      </div>
    </section>
    <noscript>請開啟 JavaScript 以遊玩《貓貓啟示錄》。</noscript>
  </main>
  <input id="soundtrack-file" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.webm" hidden aria-label="匯入背景音樂音訊檔">
</body>
</html>
